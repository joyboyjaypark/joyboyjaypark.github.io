<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superinvestor Stock Dashboard</title>
<style>
  :root {
    --bg:#0f1117;--surface:#1a1d26;--surface2:#22263a;
    --accent:#4f8ef7;--accent2:#7c5cfc;
    --text:#e4e6f0;--muted:#8890a8;--border:#2e3347;
    --green:#29d98a;--red:#f05c6e;
    --row-odd:#1a1d26;--row-even:#1f2235;--row-hover:#5c1515;
    --sticky-bg:#161926;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  .header{
    background:linear-gradient(135deg,#1a1d26 0%,#22263a 100%);
    border-bottom:1px solid var(--border);
    padding:20px 28px;display:flex;align-items:center;gap:16px;
    position:sticky;top:0;z-index:200;
  }
  .logo{font-size:22px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{font-size:12px;color:var(--muted);margin-top:2px}
  .stats{margin-left:auto;display:flex;gap:20px}
  .stat-badge{text-align:center}
  .stat-badge .num{font-size:20px;font-weight:700;color:var(--accent)}
  .stat-badge .lbl{font-size:11px;color:var(--muted)}
  .controls{
    padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    position:sticky;top:73px;z-index:180;
  }
  .search-box{position:relative;flex:1;max-width:320px}
  .search-box input{
    width:100%;padding:8px 12px 8px 34px;
    background:var(--bg);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-size:13px;outline:none;
    transition:border-color .2s;
  }
  .search-box input:focus{border-color:var(--accent)}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
  .info-text{font-size:12px;color:var(--muted)}
  .updated{font-size:11px;color:var(--muted);margin-left:auto}
  .tab-row{
    display:flex;align-items:center;flex-wrap:nowrap;
    background:var(--surface);border-bottom:1px solid var(--border);
    position:sticky;top:117px;z-index:170;
    padding:6px 28px;gap:8px;
  }
  .tabs{
    display:flex;flex-wrap:wrap;gap:6px;flex:1;
  }
  .tab-btn{
    padding:5px 14px;border:1px solid var(--border);border-radius:20px;
    background:transparent;color:var(--muted);font-size:12px;cursor:pointer;
    transition:all .2s;
  }
  .tab-btn:hover{border-color:var(--accent);color:var(--accent)}
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .table-wrapper{overflow:auto;max-height:calc(100vh - 170px);padding:0 28px 28px}
  table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12.5px}
  thead{position:sticky;top:0;z-index:100}
  th{
    background:var(--surface2);color:var(--muted);
    padding:9px 12px;white-space:nowrap;
    border-bottom:2px solid var(--border);border-right:1px solid var(--border);
    cursor:pointer;user-select:none;font-weight:600;font-size:11px;letter-spacing:.3px;
    transition:background .15s,color .15s;text-align:left;
  }
  th:hover{background:#2a3050;color:var(--text)}
  th.sort-asc::after{content:" ▲";color:var(--accent);font-size:9px}
  th.sort-desc::after{content:" ▼";color:var(--accent);font-size:9px}
  th.sticky-col{position:sticky;z-index:110}
  th.col0{left:0;width:52px;min-width:52px}
  th.col1{left:52px;width:82px;min-width:82px}
  th.col2{left:134px;border-right:2px solid var(--accent)!important}
  td{padding:7px 12px;white-space:nowrap;border-bottom:1px solid var(--border);border-right:1px solid rgba(255,255,255,.04)}
  tr:nth-child(odd) td{background:var(--row-odd)}
  tr:nth-child(even) td{background:var(--row-even)}
  tr:hover td{background:var(--row-hover)!important}
  td.sticky-col{position:sticky;z-index:10}
  tr:nth-child(odd) td.sticky-col{background:var(--sticky-bg)}
  tr:nth-child(even) td.sticky-col{background:#1c1f30}
  tr:hover td.sticky-col{background:var(--row-hover)!important}
  tr.exact-match td{background:#5c5000!important}
  tr.exact-match td.sticky-col{background:#4a4200!important}
  tr.exact-match:hover td{background:#7a6800!important}
  td.col0{left:0;width:52px;min-width:52px;text-align:center;color:var(--muted);font-size:12px}
  td.col1{left:52px;width:82px;min-width:82px;font-weight:700;color:var(--accent);font-size:13px}
  td.col2{left:134px;border-right:2px solid var(--accent)!important}
  .pct-pos{color:var(--green);font-weight:500}
  .pct-neg{color:var(--red);font-weight:500}
  .pct-zero{color:var(--muted)}
  .na{color:var(--border);font-size:11px}
  .hl{color:var(--red);font-weight:700}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums}
  .no-result{text-align:center;padding:60px;color:var(--muted);font-size:14px}
  .table-wrapper::-webkit-scrollbar{width:6px;height:6px}
  .table-wrapper::-webkit-scrollbar-track{background:var(--bg)}
  .table-wrapper::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .table-wrapper::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  thead .summary-row td{background:#252a42;border-bottom:1px solid var(--border)}
  thead .top10-row td{border-bottom:1px solid var(--accent2)}
  thead .ex10-row td{border-bottom:1px solid #555e72}
  thead .all-row td{border-bottom:2px solid var(--accent)}
  td.summary-label{color:var(--accent);font-weight:700;font-size:11px;white-space:nowrap}
  td.summary-cell{font-size:11.5px}
  thead .summary-row:hover td{background:#2d3250!important}
  thead td.sticky-col{position:sticky;z-index:110}
  .expand-btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:700;line-height:1;background:transparent;transition:all .15s;user-select:none}
  .expand-btn:hover{background:var(--accent);color:#fff}
  tr.sector-child td{background:#151828!important;font-size:12px}
  tr.sector-child td.sticky-col{background:#151828!important}
  tr.sector-child:hover td{background:#5c1515!important}
  tr.sector-child td.col1{color:var(--accent);font-weight:700}
  tr.sector-child td.ticker-indent{padding-left:32px!important}
  #chart-area{display:none;background:var(--surface);border-bottom:1px solid var(--border)}
  #chart-ctrl{padding:10px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface2);position:sticky;top:0;z-index:50}
  .ctrl-group{display:flex;align-items:center;gap:6px}
  .ctrl-group input[type=checkbox]{width:16px;height:16px;accent-color:var(--red);cursor:pointer;flex-shrink:0}
  .ctrl-group input[type=number]{width:60px;padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);text-align:center}
  .ctrl-group label{cursor:pointer;user-select:none;white-space:nowrap}
  #rise-badge .cnt-red{color:var(--red);font-weight:600}
  #chart-inner{position:relative;width:100%;padding:20px 28px}
  .nav-btn{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s}
  .nav-btn:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .nav-btn:not(:disabled):hover{background:var(--accent);color:#fff}
  .nav-btn:disabled{opacity:0.35;cursor:default}
  .nav-date-lbl{font-size:12px;color:var(--text);font-weight:600;min-width:80px;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="header">
  <div>
    <div class="logo">📊 Superinvestor Stock Dashboard</div>
  </div>
  <div class="stats">
    <div class="stat-badge"><div class="num" id="total-count">499</div><div class="lbl">종목 수</div></div>
    <div class="stat-badge"><div class="num" id="shown-count">499</div><div class="lbl">표시 중</div></div>
  </div>
</div>
<div class="controls">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="text" placeholder="티커 · 종목명 · 섹터 검색…" oninput="applyFilter()">
  </div>
  <span class="info-text" id="sort-info">컬럼 헤더를 클릭하면 정렬됩니다</span>
  <span class="updated">생성: 2026-07-04 02:04</span>
</div>
<div class="tab-row">
  <div class="tabs" id="tabs"></div>
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto">
    <button id="nav-prev" class="nav-btn" disabled>◀ 이전일</button>
    <span id="nav-date" class="nav-date-lbl"></span>
    <button id="nav-next" class="nav-btn" disabled>다음일 ▶</button>
  </div>
</div>
<div id="chart-area">
  <div id="chart-ctrl">
    <div class="ctrl-group">
      <input type="checkbox" id="chk-consec" checked>
      <label for="chk-consec">연속 상승 기준일수 (N일):</label>
      <input id="rise-input" type="number" min="1" max="7" value="2">
    </div>
    <div class="ctrl-group">
      <input type="checkbox" id="chk-pct">
      <label for="chk-pct">최근</label>
      <input id="pct-days-input" type="number" min="1" max="30" value="5">
      <label for="pct-days-input">일간</label>
      <input id="pct-val-input" type="number" min="0" max="100" step="0.5" value="3">
      <label for="pct-val-input">% 이상 상승</label>
    </div>
    <div class="ctrl-group">
      <input type="checkbox" id="chk-cnt">
      <label for="chk-cnt">종목수</label>
      <input id="cnt-input" type="number" min="1" max="100" value="5">
      <label for="cnt-input">개 이상</label>
    </div>
    <div class="ctrl-group">
      <input type="checkbox" id="chk-rank">
      <label for="chk-rank">최근</label>
      <input id="rank-days-input" type="number" min="1" max="7" value="2">
      <label for="rank-days-input">일 연속 순위 상승</label>
    </div>
    <span id="rise-badge"></span>
  </div>
  <div id="chart-inner"><canvas id="chart-canvas"></canvas></div>
</div>
<div class="table-wrapper">
  <table id="mainTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

function highlight(str, q) {
  if (!q || str === null || str === undefined) return String(str || '');
  const s = String(str);
  const ql = q.toLowerCase();
  let result = '', i = 0;
  while (i < s.length) {
    const idx = s.toLowerCase().indexOf(ql, i);
    if (idx === -1) { result += s.slice(i); break; }
    result += s.slice(i, idx) + '<span class="hl">' + s.slice(idx, idx + ql.length) + '</span>';
    i = idx + ql.length;
  }
  return result;
}

function fmtH(val, col) {
  const base = fmt(val, col);
  if (!searchQuery || !TEXT_SET.has(col) || base.startsWith('<span class="na">')) return base;
  return highlight(base, searchQuery);
}

function buildGroupRows(tabName) {
  const groupKey = GROUP_TABS[tabName];
  const cols = TABS_DEF[tabName] || [];
  const groups = {};
  RAW.forEach(r => {
    const s = r[groupKey] || '미분류';
    if (!groups[s]) groups[s] = [];
    groups[s].push(r);
  });
  const rows = Object.entries(groups).map(([groupName, recs]) => {
    const row = {};
    cols.forEach(col => {
      if (col === '순위') { row[col] = 0; return; }
      if (col === '티커')  { row[col] = null; return; }
      if (col === '종목명') { row[col] = groupName; return; }
      if (col === '종목수') { row[col] = recs.length; return; }
      const vals = recs.map(r => parseFloat(r[col])).filter(v => !isNaN(v));
      row[col] = vals.length ? (SUM_COLS.has(col)
        ? vals.reduce((a,b)=>a+b,0)
        : vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    });
    row._stocks = [...recs].sort((a,b)=>(parseFloat(b['시가총액(M$)'])||0)-(parseFloat(a['시가총액(M$)'])||0));
    return row;
  });
  rows.sort((a,b)=>(parseFloat(b['시가총액(M$)'])||0)-(parseFloat(a['시가총액(M$)'])||0));
  rows.forEach((r,i)=>{ r['순위']=i+1; });
  return rows;
}

function toggleGroup(tabName, groupName) {

}

function fmt(val, col) {
  if (val === null || val === undefined || val === '') return '<span class="na">—</span>';
  if (TEXT_SET.has(col)) return String(val);
  const n = parseFloat(val);
  if (isNaN(n)) return String(val);
  if (PCT_SET.has(col)) {
    const s = n.toFixed(2) + '%';
    if (n > 0)  return `<span class="pct-pos num-cell">+${s}</span>`;
    if (n < 0)  return `<span class="pct-neg num-cell">${s}</span>`;
    return `<span class="pct-zero num-cell">${s}</span>`;
  }
  if (col.includes('시가총액') || col.includes('매출') || col.includes('순이익') || col.includes('거래량') || col.includes('유통주식')) {
    if (Math.abs(n) >= 1000000) return `<span class="num-cell">${(n/1000000).toFixed(2)}T</span>`;
    if (Math.abs(n) >= 1000) return `<span class="num-cell">${(n/1000).toFixed(1)}B</span>`;
    return `<span class="num-cell">${n.toFixed(2)}</span>`;
  }
  if (col === '임직원수') return `<span class="num-cell">${Number(n).toLocaleString()}</span>`;
  const dec = Number.isInteger(n) ? 0 : 2;
  return `<span class="num-cell">${n.toFixed(dec)}</span>`;
}

  ).join('');
}

function switchTab(name) {
  currentTab = name; sortCol = null; sortDir = 1;
  if (GROUP_TABS[name]) groupFiltered[name] = buildGroupRows(name);
  renderTabs();
  const isChart = !!CHART_TABS[name];
  document.getElementById('chart-area').style.display = isChart ? 'block' : 'none';
  document.querySelector('.table-wrapper').style.display = isChart ? 'none' : '';
  if (isChart) { renderChart(name); } else { renderTable(); }
}

function calcSummaryRow(rows, cols, label) {
  const res = {};
  cols.forEach((col, i) => {
    if (i < 2) { res[col] = ''; return; }
    if (col === '종목명') { res[col] = label; return; }
    if (TEXT_SET.has(col)) { res[col] = ''; return; }
    const vals = rows.map(r => parseFloat(r[col])).filter(v => !isNaN(v));
    if (!vals.length) { res[col] = null; return; }
    res[col] = SUM_COLS.has(col)
      ? vals.reduce((a, b) => a + b, 0)
      : vals.reduce((a, b) => a + b, 0) / vals.length;
  });
  return res;
}

function summaryRowHtml(cols, data, rowCls) {
  return '<tr class="summary-row ' + rowCls + '">' + cols.map((c, i) => {
    const sticky = i===0 ? ' sticky-col col0' : i===1 ? ' sticky-col col1' : i===2 ? ' sticky-col col2' : '';
    const base = sticky + ' summary-cell';
    if (c === '순위' || c === '티커') return `<td class="${base}"><span class="na">—</span></td>`;
    if (c === '종목명') return `<td class="${base} summary-label">${data['종목명']}</td>`;
    const v = data[c];
    if (v === '' || v === null || v === undefined) return `<td class="${base}"><span class="na">—</span></td>`;
    return `<td class="${base}">${fmt(v, c)}</td>`;
  }).join('') + '</tr>';
}

      const sc = c === sortCol ? (sortDir===1?' sort-asc':' sort-desc') : '';
      return `<th class="${sticky}${sc}" onclick="sortBy('${c.replace(/'/g,"\'")}')"> ${c}</th>`;
    }).join('') + '</tr>';
}

function renderRows(cols, rows) {
  if (!rows.length) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="${cols.length}" class="no-result">검색 결과가 없습니다</td></tr>`;
    return;
  }
  const isGroup = !!GROUP_TABS[currentTab];
  const html = [];
  rows.forEach(row => {
    const groupName = isGroup ? row['종목명'] : null;
    const isExpanded = isGroup && (groupExpanded[currentTab]||new Set()).has(groupName);
    const trParts = cols.map((c, i) => {
      let sticky = isGroup
        ? (i===0 ? ' sticky-col col0' : i===1 ? ' sticky-col col1' : i===2 ? ' sticky-col col2' : '')
        : (i===0 ? ' sticky-col col0' : i===1 ? ' sticky-col col1' : i===2 ? ' sticky-col col2' : '');
      if (isGroup && c === '순위') {
        const btn = `<span class="expand-btn" onclick="toggleGroup('${currentTab}','${groupName.replace(/'/g,"\'")}')">${isExpanded?'−':'+'}</span>`;
        return `<td class="${sticky}" style="text-align:center">${row[c]} ${btn}</td>`;
      }
      if (isGroup && c === '티커') {
        return `<td class="${sticky}"><span class="na">—</span></td>`;
      }
      if (isGroup && c === '종목명') {
        return `<td class="${sticky} summary-label">${fmtH(row[c], c)}</td>`;
      }
      if (isGroup && c === '종목수') {
        return `<td style="text-align:center;color:var(--muted);font-size:12px">${row[c]}</td>`;
      }
      return `<td class="${sticky}">${fmtH(row[c], c)}</td>`;
    }).join('');
    const isExact = !isGroup && searchQuery && (row['티커']||'').toLowerCase() === searchQuery.toLowerCase();
    html.push(`<tr${isExact ? ' class="exact-match"' : ''}>${trParts}</tr>`);

    if (isExpanded && row._stocks) {
      const stockCols = TABS_DEF[currentTab];
      row._stocks.forEach((stock, si) => {
        const childParts = stockCols.map((c, i) => {
          let sticky = i===0 ? ' sticky-col col0' : i===1 ? ' sticky-col col1' : i===2 ? ' sticky-col col2' : '';
          if (c === '순위') return `<td class="${sticky} ticker-indent" style="color:var(--muted);text-align:center">${stock['순위'] ?? si+1}</td>`;
          if (c === '티커') {
            const _tk = stock['티커'] || '';
            return `<td class="${sticky}"><span style="color:var(--accent);font-weight:700;font-size:13px">${searchQuery ? highlight(_tk, searchQuery) : _tk}</span></td>`;
          }
          if (c === '종목명') {
            return `<td class="${sticky} ticker-indent">${fmtH(stock['종목명'], '종목명')}</td>`;
          }
          if (c === '종목수') return `<td><span class="na">—</span></td>`;
          return `<td class="${sticky}">${fmtH(stock[c], c)}</td>`;
        }).join('');
        const childExact = searchQuery && (stock['티커']||'').toLowerCase() === searchQuery.toLowerCase();
        html.push(`<tr class="sector-child${childExact ? ' exact-match' : ''}">${childParts}</tr>`);
      });
    }
  });
  document.getElementById('tbody').innerHTML = html.join('');
}

function renderTable() {
  if (CHART_TABS[currentTab]) return;
  const cols = TABS_DEF[currentTab];
  const rows = GROUP_TABS[currentTab] ? groupFiltered[currentTab] : filtered;
  renderHeader(cols); renderRows(cols, rows);
  document.getElementById('shown-count').textContent = rows.length;
}

function sortBy(col) {
  sortDir = (sortCol === col) ? -sortDir : 1;
  sortCol = col;
  const rows = GROUP_TABS[currentTab] ? groupFiltered[currentTab] : filtered;
  rows.sort((a, b) => {
    let va=a[col], vb=b[col];
    if(va===null||va===undefined) return 1;
    if(vb===null||vb===undefined) return -1;
    const na=parseFloat(va), nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb)) return (na-nb)*sortDir;
    return String(va).localeCompare(String(vb),'ko')*sortDir;
  });
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if(th.textContent.trim().replace(/ [▲▼]$/,'') === col)
      th.classList.add(sortDir===1?'sort-asc':'sort-desc');
  });
  const cols = TABS_DEF[currentTab];
  renderRows(cols, rows);
  document.getElementById('sort-info').textContent = `정렬: ${col} ${sortDir===1?'▲ 오름차순':'▼ 내림차순'}`;
}

function applyFilter() {
  if (CHART_TABS[currentTab]) return;
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  searchQuery = q;
  if (GROUP_TABS[currentTab]) {
    const all = buildGroupRows(currentTab);
    groupFiltered[currentTab] = q ? all.filter(r => (r['종목명']||'').toLowerCase().includes(q)) : all;
    renderTable();
    return;
  }
  filtered = q
    ? RAW.filter(r => ['티커','종목명','섹터','업종','국가'].some(k => (r[k]||'').toLowerCase().includes(q)))
    : [...RAW];
  if (sortCol) {
    filtered.sort((a,b) => {
      let va=a[sortCol],vb=b[sortCol];
      if(va===null||va===undefined) return 1;
      if(vb===null||vb===undefined) return -1;
      const na=parseFloat(va),nb=parseFloat(vb);
      if(!isNaN(na)&&!isNaN(nb)) return (na-nb)*sortDir;
      return String(va).localeCompare(String(vb),'ko')*sortDir;
    });
  }
  renderTable();
}

const RED = '#f05c6e';
const GRAY = '#555e72';

function calcIndustryReturns(raw) {
  const map = {};
  raw.forEach(r => {
    const ind = r['업종'] || '미분류';
    const v = parseFloat(r['1주수익률(%)']);
    if (!isNaN(v)) {
      if (!map[ind]) map[ind] = [];
      map[ind].push(v);
    }
  });
  const result = {ret: {}, cnt: {}};
  Object.entries(map).forEach(([k, arr]) => {
    result.ret[k] = arr.reduce((a, b) => a + b, 0) / arr.length;
    result.cnt[k] = arr.length;
  });
  return result;
}

function isConsecNRise(vals, n) {
  if (vals.length < n + 1) return false;
  const tail = vals.slice(-(n + 1));
  for (let i = 1; i <= n; i++) {
    if (tail[i] < tail[i - 1]) return false;
  }
  return true;
}

function isConsecNRankRise(ranks, n) {
  const nonNull = ranks.filter(v => v !== null);
  if (nonNull.length < n + 1) return false;
  const tail = nonNull.slice(-(n + 1));
  for (let i = 1; i <= n; i++) {
    if (tail[i] >= tail[i - 1]) return false;
  }
  return true;
}

function isPctRise(vals, days, pct) {
  const nonNull = vals.filter(v => v !== null);
  if (nonNull.length < 2) return false;
  const tail = nonNull.slice(-Math.min(days, nonNull.length));
  const total = tail.reduce((a, b) => a + b, 0);
  return total >= pct;
}

function applyRiseFilter() {
  if (!window._indVals || !window._chartInst) return;
  const useConsec  = document.getElementById('chk-consec').checked;
  const usePct     = document.getElementById('chk-pct').checked;
  const useCnt     = document.getElementById('chk-cnt').checked;
  const useRank    = document.getElementById('chk-rank').checked;
  const n          = parseInt(document.getElementById('rise-input').value) || 2;
  const pctDays    = parseInt(document.getElementById('pct-days-input').value) || 5;
  const pctVal     = parseFloat(document.getElementById('pct-val-input').value) || 3;
  const cntMin     = parseInt(document.getElementById('cnt-input').value) || 5;
  const rankDays   = parseInt(document.getElementById('rank-days-input').value) || 2;
  const inds = Object.keys(window._indVals);
  let redCnt = 0;
  window._chartInst.data.datasets.forEach((ds, i) => {
    const vals = (window._indVals[inds[i]] || []);
    const nonNull = vals.filter(v => v !== null);
    let isRed = true;
    if (!useConsec && !usePct && !useCnt && !useRank) isRed = false;
    if (useConsec && !isConsecNRise(nonNull, n)) isRed = false;
    if (usePct    && !isPctRise(nonNull, pctDays, pctVal)) isRed = false;
    if (useCnt    && (window._indCnts[inds[i]] || 0) < cntMin) isRed = false;
    if (useRank   && !isConsecNRankRise((window._indRanks[inds[i]] || []), rankDays)) isRed = false;
    if (isRed) redCnt++;
    const color = isRed ? RED : GRAY;
    ds.borderColor = color;
    ds._origColor = color;
    ds.pointBackgroundColor = color;
    ds.pointHoverRadius = isRed ? 5 : 3;
  });
  document.getElementById('rise-badge').innerHTML =
    '<span class="cnt-red">' + redCnt + '개 해당</span> / ' + (inds.length - redCnt) + '개 회색';
  window._chartInst.update('none');
}

const rightLabelPlugin = {
  id: 'rightLabel',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (!meta.visible || !meta.data.length) return;
      const pt = meta.data[meta.data.length - 1];
      const lastDateIdx = meta.data.length - 1;
      const rank = window._indRanks?.[ds.label]?.[lastDateIdx];
      const rankStr = rank ? ` #${rank}위` : '';
      ctx.save();
      ctx.font = '11px sans-serif';
      ctx.fillStyle = ds.borderColor;
      ctx.textAlign = 'left';
      ctx.fillText(ds.label + rankStr, pt.x + 6, pt.y + 4);
      ctx.restore();
    });
  }
};

const HOVER_BLUE = '#4a9eff';

const hoverLinePlugin = {
  id: 'hoverLine',
  beforeDatasetsDraw(chart) {
    if (chart._hoveredIdx === undefined || chart._hoveredIdx === null) return;
    chart.data.datasets.forEach((ds, i) => {
      if (i === chart._hoveredIdx) {
        ds.borderWidth = 4;
        ds.borderColor = HOVER_BLUE;
        ds.pointBackgroundColor = HOVER_BLUE;
      } else {
        ds.borderWidth = 1;
        ds.borderColor = ds._origColor === RED ? 'rgba(240,92,110,0.18)' : 'rgba(85,94,114,0.18)';
      }
    });
  }
};

async function renderChart(tabName) {
  const canvas = document.getElementById('chart-canvas');
  const inner = document.getElementById('chart-inner');
  inner.style.height = '3000px';
  if (window._chartInst) { window._chartInst.destroy(); window._chartInst = null; }
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const thisFolderIdx = pathParts.findIndex(p => /^\d{6}$/.test(p));
  const thisDate = thisFolderIdx >= 0 ? pathParts[thisFolderIdx] : null;
  if (!thisDate) return;
  const basePath = window.location.pathname.replace(/\/\d{6}\/.*$/, '');
  const y = 2000 + parseInt(thisDate.substring(0, 2));
  const m = parseInt(thisDate.substring(2, 4)) - 1;
  const d = parseInt(thisDate.substring(4, 6));
  const base = new Date(y, m, d);
  const candidates = [];
  for (let i = 13; i >= 0; i--) {
    const dt = new Date(base);
    dt.setDate(dt.getDate() - i);
    const yy = String(dt.getFullYear()).slice(2).padStart(2, '0');
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    candidates.push(yy + mm + dd);
  }
  const results = await Promise.all(candidates.map(async dateStr => {
    try {
      const url = basePath + '/' + dateStr + '/index.html';
      const resp = await fetch(url);
      if (!resp.ok) return null;
      const html = await resp.text();
      const mx = html.match(/const RAW\s*=\s*(\[[\s\S]*?\]);\s*\n/);
      if (!mx) return null;
      return { date: dateStr, ...calcIndustryReturns(JSON.parse(mx[1])) };
    } catch(e) { return null; }
  }));
  const valid = results.filter(Boolean);
  if (!valid.length) return;
  const dateLabels = valid.map(r => {
    const s = r.date;
    return parseInt(s.substring(2, 4)) + '/' + parseInt(s.substring(4, 6));
  });
  const allInds = Object.keys(calcIndustryReturns(RAW).ret);
  const indVals = {};
  const indCnts = {};
  allInds.forEach(ind => {
    indVals[ind] = valid.map(r => r.ret[ind] !== undefined ? r.ret[ind] : null);
    indCnts[ind] = valid[valid.length - 1]?.cnt[ind] || 0;
  });
  window._indVals = indVals;
  window._indCnts = indCnts;
  const indRanks = {};
  allInds.forEach(ind => { indRanks[ind] = new Array(valid.length).fill(null); });
  valid.forEach((r, di) => {
    const pairs = allInds
      .map(ind => ({ ind, val: r.ret[ind] }))
      .filter(x => x.val !== undefined && x.val !== null);
    pairs.sort((a, b) => b.val - a.val);
    pairs.forEach((x, ri) => { indRanks[x.ind][di] = ri + 1; });
  });
  window._indRanks = indRanks;
  const n = parseInt(document.getElementById('rise-input').value) || 2;
  const pctDays = parseInt(document.getElementById('pct-days-input').value) || 5;
  const pctVal  = parseFloat(document.getElementById('pct-val-input').value) || 3;
  const cntMin  = parseInt(document.getElementById('cnt-input').value) || 5;
  const rankDays = parseInt(document.getElementById('rank-days-input').value) || 2;
  const useConsec = document.getElementById('chk-consec').checked;
  const usePct    = document.getElementById('chk-pct').checked;
  const useCnt    = document.getElementById('chk-cnt').checked;
  const useRank   = document.getElementById('chk-rank').checked;
  const datasets = allInds.map(ind => {
    const nonNull = (indVals[ind] || []).filter(v => v !== null);
    let isRed = true;
    if (!useConsec && !usePct && !useCnt && !useRank) isRed = false;
    if (useConsec && !isConsecNRise(nonNull, n)) isRed = false;
    if (usePct    && !isPctRise(nonNull, pctDays, pctVal)) isRed = false;
    if (useCnt    && (indCnts[ind] || 0) < cntMin) isRed = false;
    if (useRank   && !isConsecNRankRise((indRanks[ind] || []), rankDays)) isRed = false;
    const color = isRed ? RED : GRAY;
    return {
      label: ind,
      data: indVals[ind],
      borderColor: color,
      _origColor: color,
      pointBackgroundColor: color,
      borderWidth: 1.5,
      hoverBorderWidth: 1.5,
      hoverBorderColor: color,
      pointRadius: 3,
      pointHoverRadius: isRed ? 5 : 3,
      tension: 0.3,
      fill: false,
    };
  });
  const redCnt = datasets.filter(ds => ds._origColor === RED).length;
  document.getElementById('rise-badge').innerHTML =
    '<span class="cnt-red">' + redCnt + '개 해당</span> / ' + (allInds.length - redCnt) + '개 회색';
  ['rise-input','pct-days-input','pct-val-input','cnt-input','rank-days-input'].forEach(id => {
    document.getElementById(id).oninput = () => applyRiseFilter();
  });
  ['chk-consec','chk-pct','chk-cnt','chk-rank'].forEach(id => {
    document.getElementById(id).onchange = () => applyRiseFilter();
  });
  window._chartInst = new Chart(canvas, {
    type: 'line',
    data: { labels: dateLabels, datasets },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { right: 120 } },
      interaction: { mode: 'nearest', intersect: false, axis: 'xy' },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: item => item.dataset._origColor === RED,
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              if (v === null) return '';
              const rank = window._indRanks?.[ctx.dataset.label]?.[ctx.dataIndex];
              const rankStr = rank ? ` (${rank}위)` : '';
              const lines = [' ' + ctx.dataset.label + ': ' + (v >= 0 ? '+' : '') + v.toFixed(2) + '%' + rankStr];
              const vals = window._indVals?.[ctx.dataset.label];
              if (vals) {
                const di = ctx.dataIndex;
                const curLevel = 100 + v;
                for (let n = 1; n <= 3; n++) {
                  if (di - n >= 0 && vals[di - n] !== null) {
                    const prevLevel = 100 + vals[di - n];
                    const ret = (curLevel / prevLevel - 1) * 100;
                    lines.push('  ' + n + '일 수익률: ' + (ret >= 0 ? '+' : '') + ret.toFixed(2) + '%');
                  }
                }
              }
              return lines;
            }
          }
        }
      },
      onHover: (evt, elements, chart) => {
        const prev = chart._hoveredIdx;
        const redEl = elements.find(el => chart.data.datasets[el.datasetIndex]?._origColor === RED);
        const next = redEl != null ? redEl.datasetIndex : null;
        if (prev !== next) {
          if (next === null) {
            chart.data.datasets.forEach(ds => {
              ds.borderWidth = 1.5;
              ds.borderColor = ds._origColor;
            });
          } else {
            chart.data.datasets.forEach((ds, i) => {
              if (i === next) {
                ds.borderWidth = 3;
                ds.borderColor = RED;
              } else {
                ds.borderWidth = 1;
                ds.borderColor = ds._origColor === RED
                  ? 'rgba(255,99,72,0.3)'
                  : 'rgba(100,100,100,0.2)';
              }
            });
          }
          chart._hoveredIdx = next;
          chart.update('none');
        }
      },
      scales: {
        x: {
          ticks: { color: '#8890a8', font: { size: 11 } },
          grid: { color: 'rgba(46,51,71,0.6)' },
          border: { color: '#2e3347' }
        },
        y: {
          ticks: { color: '#8890a8', callback: v => v + '%', font: { size: 11 } },
          grid: {
            color: ctx => ctx.tick.value === 0 ? '#f5c518' : 'rgba(46,51,71,0.4)',
            lineWidth: ctx => ctx.tick.value === 0 ? 1.5 : 1,
          },
          border: { color: '#2e3347' }
        }
      }
    },
    plugins: [rightLabelPlugin, hoverLinePlugin]
  });
  canvas.addEventListener('mouseleave', () => {
    if (window._chartInst) {
      window._chartInst.data.datasets.forEach(ds => {
        ds.borderWidth = 1.5;
        ds.borderColor = ds._origColor;
        ds.pointBackgroundColor = ds._origColor;
      });
      window._chartInst._hoveredIdx = null;
      window._chartInst.update('none');
    }
  });
}

async function initDayNav() {
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const idx = pathParts.findIndex(p => /^\d{6}$/.test(p));
  if (idx < 0) return;
  const thisDate = pathParts[idx];
  const basePath = window.location.pathname.replace(/\/\d{6}\/.*$/, '');
  const y = 2000 + parseInt(thisDate.substring(0,2));
  const m = parseInt(thisDate.substring(2,4)) - 1;
  const d = parseInt(thisDate.substring(4,6));
  const base = new Date(y, m, d);
  function toDs(dt) {
    const yy = String(dt.getFullYear()).slice(2).padStart(2,'0');
    const mm = String(dt.getMonth()+1).padStart(2,'0');
    const dd = String(dt.getDate()).padStart(2,'0');
    return yy+mm+dd;
  }
  async function checkDate(ds) {
    try { const r = await fetch(basePath+'/'+ds+'/index.html',{method:'HEAD'}); return r.ok; }
    catch(e) { return false; }
  }
  function getFilterParams() {
    const p = new URLSearchParams();
    p.set('tab',    currentTab);
    p.set('q',      document.getElementById('searchInput').value.trim());
    p.set('consec', document.getElementById('chk-consec').checked ? '1' : '0');
    p.set('rn',     document.getElementById('rise-input').value);
    p.set('pct',    document.getElementById('chk-pct').checked ? '1' : '0');
    p.set('pd',     document.getElementById('pct-days-input').value);
    p.set('pv',     document.getElementById('pct-val-input').value);
    p.set('cnt',    document.getElementById('chk-cnt').checked ? '1' : '0');
    p.set('cn',     document.getElementById('cnt-input').value);
    p.set('rank',   document.getElementById('chk-rank').checked ? '1' : '0');
    p.set('rd',     document.getElementById('rank-days-input').value);
    return p.toString();
  }
  const lbl = document.getElementById('nav-date');
  if (lbl) lbl.textContent = `20${thisDate.substring(0,2)}-${thisDate.substring(2,4)}-${thisDate.substring(4,6)}`;
  const [prevDs, nextDs] = await Promise.all([
    (async()=>{ for(let i=1;i<=7;i++) { const dt=new Date(base); dt.setDate(dt.getDate()-i); const ds=toDs(dt); if(await checkDate(ds)) return ds; } return null; })(),
    (async()=>{ for(let i=1;i<=7;i++) { const dt=new Date(base); dt.setDate(dt.getDate()+i); const ds=toDs(dt); if(await checkDate(ds)) return ds; } return null; })(),
  ]);
  const prevBtn = document.getElementById('nav-prev');
  const nextBtn = document.getElementById('nav-next');
  if (prevDs && prevBtn) { prevBtn.disabled=false; prevBtn.onclick=()=>{ window.location.href=basePath+'/'+prevDs+'/?'+getFilterParams(); }; }
  if (nextDs && nextBtn) { nextBtn.disabled=false; nextBtn.onclick=()=>{ window.location.href=basePath+'/'+nextDs+'/?'+getFilterParams(); }; }
}

})();

if (_sp.has('q') && _sp.get('q')) {

}
initDayNav();
