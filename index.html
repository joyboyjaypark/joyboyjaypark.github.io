<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=/stock_dashboard/index.html">
  <script>
    (function(){
      var target = '/stock_dashboard/index.html';
      try {
        if (location.pathname + location.search + location.hash !== target) {
          location.replace(target);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <p>자동으로 이동하지 않으면 <a href="/stock_dashboard/index.html">여기를 클릭</a>하세요.</p>
</body>
</html>
